<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة هندسة الزراعة والحيوية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2e7d32;
            --primary-hover: #1b5e20;
            --bg: #f4f6f8;
            --text: #333;
            --card-bg: #ffffff;
            --alert-bg: #fffbe6;
            --alert-border: #ffe58f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            color: var(--primary);
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .alert-box {
            background-color: var(--alert-bg);
            border: 1px solid var(--alert-border);
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 14px;
            color: #595959;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #434343;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .link-toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .link-toggle a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        .link-toggle a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>مكتبة هندسة الزراعة والحيوية</h1>
        <p>محاضرات وسكاشن القسم - جامعة بنها</p>
    </header>

    <div class="main-container">
        <!-- كارت تسجيل الدخول الأصلي -->
        <div class="card" id="login-card">
            <h2>تسجيل الدخول</h2>
            
            <div id="alert-msg" class="alert-box hidden"></div>

            <form id="login-form">
                <div class="form-group">
                    <label>البريد الإلكتروني / اسم المستخدم</label>
                    <input type="text" id="username" required>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" class="btn-submit">دخول</button>
            </form>

            <div class="link-toggle">
                <span>ليس لديك حساب؟ </span><a onclick="showRegister()">سجل الآن طلب انضمام</a>
            </div>
        </div>

        <!-- كارت طلب انضمام طالب جديد -->
        <div class="card hidden" id="register-card">
            <h2>طلب انضمام طالب جديد</h2>

            <div id="reg-alert" class="alert-box hidden"></div>

            <form id="register-form">
                <div class="form-group">
                    <label>الاسم الثلاثي</label>
                    <input type="text" id="reg-name" required>
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="reg-email" required>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="reg-password" required>
                </div>

                <button type="submit" class="btn-submit">إرسال طلب الانضمام</button>
            </form>

            <div class="link-toggle">
                <span>لديك حساب بالفعل؟ </span><a onclick="showLogin()">تسجيل الدخول</a>
            </div>
        </div>
    </div>

                <script>
    function showRegister() {
        document.getElementById('login-card').classList.add('hidden');
        document.getElementById('register-card').classList.remove('hidden');
    }

    function showLogin() {
        document.getElementById('register-card').classList.add('hidden');
        document.getElementById('login-card').classList.remove('hidden');
    }

    // التحقق من تسجيل الدخول
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.trim().toLowerCase();
        const pass = document.getElementById('password').value;
        const alertBox = document.getElementById('alert-msg');

        // اسم المستخدم الافتراضي للأدمن
        if (user === 'admin') {
            // يمكنك تعديل كلمة المرور هنا لو أردت، أو تركها تقبل أي كلمة مرور مؤقتاً لحين الدخول
            alertBox.className = 'alert-box';
            alertBox.style.backgroundColor = '#e6f7ff';
            alertBox.style.borderColor = '#91d5ff';
            alertBox.innerText = 'تم تسجيل الدخول بنجاح! جاري التوجيه...';
            alertBox.classList.remove('hidden');
            
            localStorage.setItem('currentUser', 'admin');
            localStorage.setItem('role', 'admin');
            
            setTimeout(() => {
                // إذا لم تقم بإنشاء صفحة admin.html بعد، سنقوم بتوجيهك أو إظهار لوحة التحكم
                alertUri();
            }, 1000);
        } else {
            alertBox.className = 'alert-box';
            alertBox.style.backgroundColor = '#fffbe6';
            alertBox.style.borderColor = '#ffe58f';
            alertBox.innerText = 'بيانات الدخول غير صحيحة أو الحساب بانتظار الموافقة.';
            alertBox.classList.remove('hidden');
        }
    });

    function alertUri() {
        // مؤقتاً لتظهر لك رسالة النجاح حتى ننشئ صفحة التحكم الخاصة بالأدمن
        document.body.innerHTML = `
            <div style="text-align:center; padding:50px; font-family:'Cairo',sans-serif;">
                <h2 style="color: #2e7d32;">أهلاً بك يا أدمن في لوحة التحكم!</h2>
                <p>تم تسجيل الدخول بنجاح. هل تريد أن ننشئ صفحة لوحة التحكم (admin.html) لترفع فيها الملفات وتدير الطلاب؟</p>
                <button onclick="location.reload()" style="padding:10px 20px; background:#2e7d32; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">تسجيل الخروج</button>
            </div>
        `;
    }

    // كود إرسال طلب الانضمام
    document.getElementById('register-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const alertBox = document.getElementById('reg-alert');
        alertBox.className = 'alert-box';
        alertBox.style.backgroundColor = '#f6ffed';
        alertBox.style.borderColor = '#b7eb8f';
        alertBox.innerText = 'تم إرسال طلب الانضمام بنجاح! بانتظار موافقة الأدمن.';
        alertBox.classList.remove('hidden');
        setTimeout(showLogin, 2500);
    });
</script>
