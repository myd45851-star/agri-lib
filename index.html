<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة قسم هندسة الزراعة والحيوية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2e7d32; --secondary: #4caf50; --bg: #f4f6f8; --text: #333; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; direction: rtl; }
        header { background-color: var(--primary); color: white; padding: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { max-width: 900px; margin: 30px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        button { background-color: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: var(--secondary); }
        .hidden { display: none !important; }
        .alert { padding: 10px; background-color: #fffae6; border-right: 4px solid #ffc107; margin-bottom: 15px; border-radius: 4px; }
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: var(--primary); color: white; }
        .nav-links { text-align: center; margin-top: 15px; }
        .nav-links a { color: var(--primary); text-decoration: none; font-weight: bold; cursor: pointer; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <h1>مكتبة هندسة الزراعة والحيوية</h1>
        <p>محاضرات وسكاشن القسم - جامعة بنha</p>
    </header>

    <div class="container" id="app-container">
        <!-- قسم تسجيل الدخول -->
        <div id="login-section">
            <h2>تسجيل الدخول</h2>
            <div id="login-alert" class="alert hidden"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>البريد الإلكتروني / اسم المستخدم</label>
                    <input type="text" id="login-user" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="login-pass" required placeholder="********">
                </div>
                <button type="submit">دخول</button>
            </form>
            <div class="nav-links">
                <p>ليس لديك حساب؟ <a onclick="showRegister()">سجل الآن طلب انضمام</a></p>
            </div>
        </div>

        <!-- قسم التسجيل (طلب انضمام) -->
        <div id="register-section" class="hidden">
            <h2>طلب انضمام طالب جديد</h2>
            <div id="reg-alert" class="alert hidden"></div>
            <form id="reg-form">
                <div class="form-group">
                    <label>الاسم الثلاثي</label>
                    <input type="text" id="reg-name" required placeholder="أدخل اسمك الثلاثي">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="reg-email" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور (8 أحرف على الأقل)</label>
                    <input type="password" id="reg-pass" required placeholder="********">
                </div>
                <button type="submit">إرسال طلب الانضمام</button>
            </form>
            <div class="nav-links">
                <p>لديك حساب بالفعل؟ <a onclick="showLogin()">تسجيل الدخول</a></p>
            </div>
        </div>

        <!-- قسم المكتبة والمحتوى (يظهر بعد تسجيل الدخول الناجح) -->
        <div id="library-section" class="hidden">
            <h2>مرحباً بك في المكتبة الرقمية</h2>
            <p id="welcome-user" style="text-align: center; font-weight: bold;"></p>
            <button onclick="logout()" style="background-color: #d32f2f; width: auto; padding: 5px 15px; margin-bottom: 20px;">تسجيل الخروج</button>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>المادة الدراسية</th>
                            <th>نوع المحتوى</th>
                            <th>الملفات المتاحة</th>
                        </tr>
                    </thead>
                    <tbody id="library-content">
                        <!-- يتم تعبئة الجدول برمجياً -->
                        <tr>
                            <td colspan="3">لا توجد مواد مرفوعة حالياً. سيتم إضافة المحاضرات قريباً.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // دوال التنقل البسيطة بين الواجهات
        function showRegister() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('register-section').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('currentUser');
            document.getElementById('library-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        // التحقق المبدئي عند فتح الصفحة
        window.onload = function() {
            const user = localStorage.getItem('currentUser');
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('library-section').classList.remove('hidden');
                document.getElementById('welcome-user').innerText = `أهلاً بك، ${user}`;
            }
        };

        // محاكاة تسجيل الدخول البسيط
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('login-user').value;
            // حساب الأدمن الافتراضي أو المستخدمين المسجلين محلياً
            if (email === 'admin@agri.com' || email.includes('@')) {
                localStorage.setItem('currentUser', email);
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('library-section').classList.remove('hidden');
                document.getElementById('welcome-user').innerText = `أهلاً بك، ${email}`;
            } else {
                const alertBox = document.getElementById('login-alert');
                alertBox.innerText = 'بيانات الدخول غير صحيحة أو بانتظار موافقة الأدمن.';
                alertBox.classList.remove('hidden');
            }
        });

        // محاكاة إرسال طلب التسجيل
        document.getElementById('reg-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const alertBox = document.getElementById('reg-alert');
            alertBox.innerText = 'تم إرسال طلبك بنجاح! يجدر بالأنظار انتظار موافقة الأدمن لتفعيل حسابك.';
            alertBox.classList.remove('hidden');
            setTimeout(showLogin, 3000);
        });
    </script>
</body>
</html>
